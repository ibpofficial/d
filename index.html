<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastFetch Doodle Hub — Download All Files</title>
  <!-- Fast, lightweight client-side QR generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    /* --- From Uiverse.io by mamyapro123 & Coordinated Doodle Palette --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f1de;
      background-image: 
        radial-gradient(#e07a5f 0.75px, transparent 0.75px),
        radial-gradient(#3d405b 0.75px, #f4f1de 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
      font-family: "Patrick Hand", cursive, sans-serif;
      color: #1e1e24;
    }

    .doodle-page-title {
      font-family: "Permanent Marker", cursive, sans-serif;
      font-size: 2.2rem;
      color: #1e1e24;
      text-align: center;
      margin-bottom: 1.5rem;
      text-shadow: 3px 3px 0 #ffd166;
      letter-spacing: 1px;
    }

    .doodle-upload-container {
      --ink-color: #1e1e24;
      --zone-bg: #fffdf9;
      --paper-line: #bde0fe;

      --folder-back: #fca311; /* Rich Amber */
      --folder-front: #ffd166; /* Warm Sunflower Yellow */

      /* The Best Button Colors */
      --btn-default: #c6e377; /* Fresh Mint Green (Action) */
      --btn-hover: #c0bbfe; /* Watermelon Pink (Reaction) */
      --accent-blue: #118ab2; /* Deep playful blue for accents */

      --paper-file: #ffffff;

      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 320px;
      height: 300px;
      padding: 20px;
      cursor: pointer;
      margin-bottom: 2rem;

      /* Lined Paper Background */
      background:
        linear-gradient(var(--zone-bg) 20px, transparent 20px) 0 0 / 100% 24px,
        linear-gradient(var(--paper-line) 2px, transparent 2px) 0 20px / 100% 24px
          var(--zone-bg);

      border: 3px dashed var(--ink-color);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      box-shadow: 8px 8px 0 rgba(30, 30, 36, 0.15); /* Soft drop shadow on container */

      transition:
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.4s ease;
      filter: url(#doodle-jitter);
    }

    .hidden-file-input {
      display: none;
    }

    /* --- FOLDER LAYERS --- */
    .doodle-folder {
      position: relative;
      width: 140px;
      height: 105px;
      margin-bottom: 25px;
      animation: doodleFloat 3.5s infinite ease-in-out;
      z-index: 2;
    }

    .folder-back {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 85px;
      background: var(--folder-back);
      border: 3px solid var(--ink-color);
      border-radius: 10px 255px 15px 225px / 255px 10px 225px 15px;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.15);
      z-index: 1;
    }

    .folder-tab {
      position: absolute;
      top: -15px;
      left: 10px;
      width: 45px;
      height: 20px;
      background: var(--folder-back);
      border: 3px solid var(--ink-color);
      border-bottom: none;
      border-radius: 10px 15px 0 0 / 255px 255px 0 0;
    }

    .folder-front {
      position: absolute;
      bottom: -2px;
      left: -4px;
      width: calc(100% + 8px);
      height: 70px;
      background: var(--folder-front);
      border: 3px solid var(--ink-color);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      box-shadow: 4px 4px 0 rgba(30, 30, 36, 0.15);
      z-index: 3;
      transform-origin: bottom center;
      transition:
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.3s ease;
    }

    .folder-smile {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
    }

    /* --- PAPERS --- */
    .doodle-papers {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    .paper {
      position: absolute;
      bottom: 10px;
      width: 55px;
      height: 70px;
      background: var(--paper-file);
      border: 2px solid var(--ink-color);
      border-radius: 4px;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 8px;
      box-shadow: 2px 2px 0 rgba(30, 30, 36, 0.1);
    }

    .file-1 {
      left: 15px;
      transform: rotate(-5deg) translateY(0);
    }
    .file-2 {
      right: 15px;
      transform: rotate(5deg) translateY(0);
    }

    .scribble-line {
      height: 4px;
      background: var(--ink-color);
      margin-bottom: 6px;
      border-radius: 2px;
      width: 100%;
      opacity: 0.8;
    }
    .scribble-line.short {
      width: 60%;
    }
    .doodle-image-icon {
      width: 100%;
      height: 100%;
      opacity: 0.8;
    }

    /* --- THE NEW PERFECT BUTTON --- */
    .doodle-btn {
      background: var(--btn-default);
      border: 3px solid var(--ink-color);
      padding: 12px 28px;
      border-radius: 15px 255px 15px 225px / 255px 15px 225px 15px;
      box-shadow: 4px 4px 0 var(--ink-color);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 3;
    }

    .btn-text {
      font-family: "Permanent Marker", cursive, sans-serif;
      font-size: 19px;
      color: var(--ink-color);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #ffffff;
      transition: all 0.3s ease;
    }

    /* --- DECORATIONS --- */
    .doodle-decor {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition:
        transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
        opacity 0.3s ease;
    }

    .sparkle-1 {
      width: 24px;
      top: 30px;
      right: 40px;
      transform: scale(0) rotate(0deg);
    }
    .star-1 {
      width: 30px;
      top: 50px;
      left: 30px;
      transform: scale(0) rotate(0deg);
    }
    .doodle-paperclip {
      position: absolute;
      top: -15px;
      left: 20px;
      width: 40px;
      height: 40px;
      z-index: 10;
      transform: rotate(-15deg);
    }

    /* --- HOVER ANIMATIONS --- */
    @keyframes doodleFloat {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(2deg);
      }
    }

    @keyframes paperWiggle {
      0%,
      100% {
        transform: rotate(-15deg) translateY(-40px);
      }
      50% {
        transform: rotate(-10deg) translateY(-45px);
      }
    }
    @keyframes paperWiggle2 {
      0%,
      100% {
        transform: rotate(18deg) translateY(-35px);
      }
      50% {
        transform: rotate(22deg) translateY(-30px);
      }
    }

    .doodle-upload-container:hover {
      transform: translateY(-4px);
      box-shadow: 10px 10px 0 var(--ink-color);
      border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px;
    }

    .doodle-upload-container:hover .folder-front {
      transform: scaleY(0.85) skewX(-5deg);
      background: #ffe285;
    }

    .doodle-upload-container:hover .file-1 {
      animation: paperWiggle 1.5s infinite ease-in-out;
    }
    .doodle-upload-container:hover .file-2 {
      animation: paperWiggle2 1.5s infinite ease-in-out 0.2s;
    }

    /* THE BUTTON UPGRADE ON HOVER */
    .doodle-upload-container:hover .doodle-btn {
      background: var(--btn-hover);
      transform: scale(1.08) rotate(-3deg) translateY(-4px); /* Bigger, more playful pop */
      box-shadow: 6px 6px 0 var(--ink-color);
    }
    .doodle-upload-container:hover .btn-text {
      color: rgba(255, 255, 255, 0.85); /* Text turns white */
      text-shadow: 2px 2px 0 var(--ink-color); /* Shadow turns dark */
    }

    .doodle-upload-container:hover .doodle-decor {
      opacity: 1;
    }
    .doodle-upload-container:hover .sparkle-1 {
      transform: scale(1.2) rotate(15deg);
    }
    .doodle-upload-container:hover .star-1 {
      transform: scale(1.3) rotate(-20deg);
    }

    .doodle-upload-container:active {
      transform: translate(6px, 6px);
      box-shadow: 2px 2px 0 var(--ink-color);
    }
    .doodle-upload-container:active .doodle-btn {
      transform: scale(0.95);
      box-shadow: 2px 2px 0 var(--ink-color);
    }

    /* Notebook Section & Cards */
    .doodle-section {
      width: 100%;
      max-width: 650px;
    }

    .doodle-search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      width: 100%;
    }

    .doodle-search-input {
      flex: 1;
      padding: 10px 16px;
      font-family: "Patrick Hand", cursive, sans-serif;
      font-size: 1.1rem;
      border: 3px solid #1e1e24;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      background: #ffffff;
      outline: none;
      box-shadow: 3px 3px 0 #1e1e24;
    }

    .doodle-small-btn {
      padding: 8px 18px;
      font-family: "Permanent Marker", cursive, sans-serif;
      font-size: 1rem;
      background: #c6e377;
      border: 3px solid #1e1e24;
      border-radius: 15px 255px 15px 225px / 255px 15px 225px 15px;
      box-shadow: 3px 3px 0 #1e1e24;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #1e1e24;
      user-select: none;
    }
    .doodle-small-btn:hover {
      background: #c0bbfe;
      transform: translateY(-2px);
      box-shadow: 4px 4px 0 #1e1e24;
    }
    .doodle-small-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #1e1e24;
    }

    .doodle-card {
      background: #ffffff;
      border: 3px solid #1e1e24;
      border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px;
      padding: 16px;
      margin-bottom: 1.2rem;
      box-shadow: 6px 6px 0 rgba(30, 30, 36, 0.15);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .doodle-card:hover {
      transform: translateY(-3px) rotate(-0.5deg);
      box-shadow: 8px 8px 0 #1e1e24;
    }

    .doodle-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #ffd166;
      border: 2px solid #1e1e24;
      border-radius: 10px;
      font-family: "Permanent Marker", cursive, sans-serif;
      font-size: 0.8rem;
      margin-bottom: 6px;
    }

    /* Modal Overlay & Toast */
    .doodle-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(30, 30, 36, 0.6);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .doodle-modal-overlay.hidden {
      display: none !important;
    }

    .doodle-modal-box {
      background: #fffdf9;
      border: 4px solid #1e1e24;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      padding: 20px;
      width: 100%;
      max-width: 350px;
      box-shadow: 10px 10px 0 #1e1e24;
      text-align: center;
      position: relative;
    }

    .doodle-toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 1000;
      background: #c6e377;
      border: 3px solid #1e1e24;
      border-radius: 15px 255px 15px 225px / 255px 15px 225px 15px;
      padding: 10px 18px;
      font-family: "Patrick Hand", cursive, sans-serif;
      font-size: 1.1rem;
      font-weight: bold;
      color: #1e1e24;
      box-shadow: 4px 4px 0 #1e1e24;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .doodle-toast.hidden-toast {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- SVG Filter Definition for Hand-Drawn Doodle Jitter Effect -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="doodle-jitter">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <h1 class="doodle-page-title">✏️ FastFetch File Hub 📁</h1>

  <!-- Doodle Folder Download-All Interactive Zone -->
  <div class="doodle-upload-container" onclick="downloadAllFiles()" title="Click to download all 3 files instantly!">
    
    <!-- Paperclip Decoration -->
    <svg class="doodle-paperclip" viewBox="0 0 50 50">
      <path d="M15 15 L35 15 C40 15 40 35 35 35 L15 35 C10 35 10 20 15 20 L30 20" fill="none" stroke="#1e1e24" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <!-- Sparkles and Stars -->
    <svg class="doodle-decor sparkle-1" viewBox="0 0 50 50">
      <path d="M25 0 L30 20 L50 25 L30 30 L25 50 L20 30 L0 25 L20 20 Z" fill="#ffd166" stroke="#1e1e24" stroke-width="3"/>
    </svg>
    <svg class="doodle-decor star-1" viewBox="0 0 50 50">
      <path d="M25 0 L32 15 L49 18 L37 30 L40 47 L25 39 L10 47 L13 30 L1 18 L18 15 Z" fill="#c0bbfe" stroke="#1e1e24" stroke-width="3"/>
    </svg>

    <!-- Folder Animation Layers -->
    <div class="doodle-folder">
      <div class="folder-tab"></div>
      <div class="folder-back"></div>
      
      <!-- Popping Papers -->
      <div class="doodle-papers">
        <div class="paper file-1">
          <div class="scribble-line"></div>
          <div class="scribble-line short"></div>
          <div class="scribble-line"></div>
        </div>
        <div class="paper file-2">
          <div class="scribble-line"></div>
          <div class="scribble-line"></div>
          <div class="scribble-line short"></div>
        </div>
      </div>

      <div class="folder-front">
        <svg class="folder-smile" viewBox="0 0 40 40">
          <circle cx="12" cy="12" r="3" fill="#1e1e24"/>
          <circle cx="28" cy="12" r="3" fill="#1e1e24"/>
          <path d="M 10 20 Q 20 30 30 20" stroke="#1e1e24" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Download All Button -->
    <button class="doodle-btn" type="button" onclick="event.stopPropagation(); downloadAllFiles();">
      <span class="btn-text">DOWNLOAD ALL (3)</span>
    </button>
  </div>

  <!-- Notebook File List Section -->
  <div class="doodle-section">
    
    <!-- Search Bar -->
    <div class="doodle-search-box">
      <input 
        id="search-input" 
        type="text" 
        class="doodle-search-input" 
        placeholder="Search documents by name..." 
        oninput="filterFiles(this.value)"
      />
      <button class="doodle-small-btn" onclick="openShareHubQr()">📱 BEAM HUB</button>
    </div>

    <!-- Auto-download trigger banner -->
    <div id="autodownload-banner" class="doodle-card hidden" style="background: #fff3b0;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="autodownload-msg" style="font-size: 1.1rem;">⚡ Auto-triggering download for file...</span>
        <button onclick="dismissAutoBanner()" class="doodle-small-btn" style="padding: 4px 10px;">Dismiss</button>
      </div>
    </div>

    <!-- File Grid -->
    <div id="file-grid">
      <!-- Injected dynamically from CONFIG_FILES -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden" style="text-align: center; padding: 2rem; font-size: 1.2rem; color: #808080;">
      ✏️ No matching documents found.
    </div>

    <!-- Counter Label -->
    <div style="text-align: center; margin-top: 1rem; font-size: 1.1rem; color: #1e1e24;">
      <span id="file-counter-label">Configured Documents (3)</span> — Hosted direct on GitHub
    </div>
  </div>

  <!-- QR Code Modal (styled as Doodle notebook note) -->
  <div id="qr-modal" class="doodle-modal-overlay hidden">
    <div class="doodle-modal-box">
      <h3 id="modal-qr-title" style="font-family: 'Permanent Marker', cursive; font-size: 1.4rem; margin-bottom: 8px;">Scan to Download</h3>
      <p id="modal-qr-desc" style="font-size: 1rem; margin-bottom: 12px; color: #3d405b;">
        Point another phone camera at this code to download directly.
      </p>

      <div style="display: flex; justify-content: center; background: #ffffff; padding: 10px; border: 3px solid #1e1e24; border-radius: 12px; width: fit-content; margin: 0 auto 15px auto;">
        <div id="modal-qrcode"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button 
          id="modal-copy-link-btn" 
          onclick="copyModalLink()" 
          class="doodle-small-btn"
          style="width: 100%;"
        >
          📋 <span id="modal-copy-text">Copy Transfer Link</span>
        </button>
        <button 
          onclick="closeQrModal()" 
          class="doodle-small-btn"
          style="width: 100%; background: #ffd166;"
        >
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Pop-up -->
  <div id="toast" class="doodle-toast hidden-toast">
    <span>💡</span>
    <span id="toast-text">Notification</span>
  </div>

  <script>
    /**
     * =========================================================================
     *  CONFIG_FILES - ALL THREE GITHUB FILE ADDRESSES
     * =========================================================================
     */
    const CONFIG_FILES = [
      {
        id: "doc-1",
        name: "C_Programming_Practical_Index.dox",
        description: "Official finalized documentation & architecture blueprint.",
        size: "2.4 MB",
        badge: "DOCX",
        url: "https://github.com/ibpofficial/d/blob/58cd1311d33c469815b5c5610d07eb4f233d4e3e/C_Programming_Practical_Index.docx"
      },
      {
        id: "doc-2",
        name: "123.main.doc",
        description: "Official finalized documentation & architecture blueprint.",
        size: "2.4 MB",
        badge: "DOCX",
        url: "https://github.com/ibpofficial/d/blob/b3a946a80ff0d37e23408e04c92609f8a1686587/123.docx"
      },
      {
        id: "doc-3",
        name: "C_Programming_Practical_Index.pdf",
        description: "Official finalized documentation & architecture blueprint.",
        size: "2.4 MB",
        badge: "PDF",
        url: "https://github.com/ibpofficial/d/blob/467a60e1cf82cbe4838236be5ac4818c420e4bc2/C_Programming_Practical_Index.pdf"
      }
    ];

    let currentModalLink = "";

    // Convert standard GitHub blob links to direct downloadable raw links
    function normalizeGithubRawUrl(url) {
      if (!url) return "";
      try {
        const parsed = new URL(url.trim());
        if (parsed.hostname === "github.com") {
          const parts = parsed.pathname.split("/").filter(Boolean);
          // Format: github.com/:owner/:repo/blob/:branch/...
          if (parts.length >= 4 && parts[2] === "blob") {
            const owner = parts[0];
            const repo = parts[1];
            const branch = parts[3];
            const rest = parts.slice(4).join("/");
            return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${rest}`;
          }
        }
        return url;
      } catch (e) {
        return url;
      }
    }

    // Show lightweight toast notification
    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-text").innerText = msg;
      toast.classList.remove("hidden-toast");
      setTimeout(() => {
        toast.classList.add("hidden-toast");
      }, 2600);
    }

    // Clipboard copy with iframe safety
    function copyText(str, msg = "Link copied!") {
      try {
        const el = document.createElement("textarea");
        el.value = str;
        document.body.appendChild(el);
        el.select();
        document.execCommand("copy");
        document.body.removeChild(el);
        showToast(msg);
      } catch (err) {
        showToast("Error copying link");
      }
    }

    // Trigger single file download
    function triggerDownload(url, filename) {
      const directUrl = normalizeGithubRawUrl(url);

      // Primary download trigger via Anchor element
      const a = document.createElement("a");
      a.href = directUrl;
      a.download = filename || "download";
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => document.body.removeChild(a), 150);

      // Secondary fallback trigger via hidden iframe for browser compatibility
      setTimeout(() => {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = directUrl;
        document.body.appendChild(iframe);
        setTimeout(() => {
          if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        }, 6000);
      }, 200);
    }

    // Download ALL THREE configured files sequentially
    function downloadAllFiles() {
      if (!CONFIG_FILES || CONFIG_FILES.length === 0) return;

      showToast(`⚡ Downloading ALL ${CONFIG_FILES.length} files...`);

      CONFIG_FILES.forEach((f, idx) => {
        setTimeout(() => {
          triggerDownload(f.url, f.name);
        }, idx * 600); // 600ms spacing ensures browser triggers all downloads
      });
    }

    // Render file cards in doodle notebook style
    function renderFileList(list = CONFIG_FILES) {
      const container = document.getElementById("file-grid");
      const empty = document.getElementById("empty-state");

      if (!list || list.length === 0) {
        container.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }

      empty.classList.add("hidden");

      container.innerHTML = list.map(item => {
        const directUrl = normalizeGithubRawUrl(item.url);
        const crossDeviceUrl = new URL(window.location.origin + window.location.pathname);
        crossDeviceUrl.searchParams.set("download", item.id);

        return `
          <div class="doodle-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
              <div>
                <span class="doodle-badge">${escapeHtml(item.badge || 'FILE')}</span>
                <span style="font-size: 1rem; color: #666; margin-left: 6px;">${escapeHtml(item.size || '')}</span>
              </div>
              <div style="font-size: 0.9rem; color: #808080;">ID: ${escapeHtml(item.id)}</div>
            </div>

            <h3 style="font-family: 'Permanent Marker', cursive; font-size: 1.3rem; margin-bottom: 6px; word-break: break-all;">
              📄 ${escapeHtml(item.name)}
            </h3>

            <p style="font-size: 1.05rem; color: #444; margin-bottom: 12px;">
              ${escapeHtml(item.description || 'Hosted securely on GitHub Direct')}
            </p>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 2px dashed #1e1e24; padding-top: 10px;">
              <div style="display: flex; gap: 6px;">
                <button class="doodle-small-btn" onclick="openFileQr('${item.id}')" title="Scan QR to Download on Mobile">
                  📱 Beam
                </button>
                <button class="doodle-small-btn" onclick="copyText('${crossDeviceUrl.toString()}', 'Transfer link copied!')" title="Copy Download Link">
                  📋 Link
                </button>
              </div>

              <button class="doodle-small-btn" onclick="triggerDownload('${directUrl}', '${escapeHtml(item.name)}')" style="background: #ffd166;">
                💾 Download
              </button>
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("file-counter-label").innerText = `Configured Documents (${list.length})`;
    }

    function filterFiles(query) {
      const q = (query || "").toLowerCase().trim();
      if (!q) {
        renderFileList(CONFIG_FILES);
        return;
      }
      const filtered = CONFIG_FILES.filter(f => 
        f.name.toLowerCase().includes(q) || 
        (f.description && f.description.toLowerCase().includes(q)) ||
        (f.badge && f.badge.toLowerCase().includes(q))
      );
      renderFileList(filtered);
    }

    function openFileQr(fileId) {
      const file = CONFIG_FILES.find(f => f.id === fileId);
      if (!file) return;

      const beamUrl = new URL(window.location.origin + window.location.pathname);
      beamUrl.searchParams.set("download", file.id);
      currentModalLink = beamUrl.toString();

      document.getElementById("modal-qr-title").innerText = file.name;
      document.getElementById("modal-qr-desc").innerText = "Scan on your phone or other device. It will automatically download this file.";
      
      const container = document.getElementById("modal-qrcode");
      container.innerHTML = "";
      new QRCode(container, {
        text: currentModalLink,
        width: 170,
        height: 170,
        colorDark: "#1e1e24",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById("qr-modal").classList.remove("hidden");
    }

    function openShareHubQr() {
      currentModalLink = window.location.href;
      document.getElementById("modal-qr-title").innerText = "Open FastFetch Hub";
      document.getElementById("modal-qr-desc").innerText = "Scan to open the complete file list on another phone, tablet or laptop.";

      const container = document.getElementById("modal-qrcode");
      container.innerHTML = "";
      new QRCode(container, {
        text: currentModalLink,
        width: 170,
        height: 170,
        colorDark: "#1e1e24",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      document.getElementById("qr-modal").classList.remove("hidden");
    }

    function closeQrModal() {
      document.getElementById("qr-modal").classList.add("hidden");
    }

    function copyModalLink() {
      if (currentModalLink) {
        copyText(currentModalLink, "Link copied!");
        const label = document.getElementById("modal-copy-text");
        label.innerText = "Copied!";
        setTimeout(() => label.innerText = "Copy Transfer Link", 2000);
      }
    }

    function dismissAutoBanner() {
      document.getElementById("autodownload-banner").classList.add("hidden");
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Check if the page was opened on another phone/device via QR code with ?download=ID
    window.addEventListener("DOMContentLoaded", () => {
      renderFileList(CONFIG_FILES);

      const params = new URLSearchParams(window.location.search);
      const autoId = params.get("download") || params.get("id");

      if (autoId) {
        const target = CONFIG_FILES.find(f => f.id === autoId || f.name.toLowerCase() === autoId.toLowerCase());
        if (target) {
          const banner = document.getElementById("autodownload-banner");
          const msg = document.getElementById("autodownload-msg");
          msg.innerText = `Auto-downloading "${target.name}" to this system...`;
          banner.classList.remove("hidden");

          // Trigger download immediately
          setTimeout(() => {
            triggerDownload(target.url, target.name);
          }, 600);
        }
      }
    });
  </script>
</body>
</html>
